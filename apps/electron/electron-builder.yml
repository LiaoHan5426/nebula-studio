# Monorepo：pnpm-lock.yaml 在仓库根目录；electron-builder 仅在 app 目录内探测锁文件。
# 须在 apps/electron/package.json 中声明 packageManager（与根目录一致），否则易误判为 npm。
# electron-updater 必须写 semver（勿用 catalog:），否则 builder 26 会把 "catalog:electron" 当成非法版本。
# @electron/get 须由 pnpm overrides 钉到 v5+，否则 builder 下载 Electron 时读不到 ElectronDownloadCacheMode.ReadWrite。
# npm 包名是 @nebula-studio/electron；NSIS 会把 ${name} 里的 / 当成路径，导致 Can't open output file。
appId: com.electron.app
productName: Nebula Studio
extraMetadata:
  name: nebula-studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: ../sub-web/docs/dist
    to: remotes/docs
  - from: ../sub-web/settings/dist
    to: remotes/settings
  - from: ../sub-web/integration/dist
    to: remotes/integration
asarUnpack:
  - resources/**
extraFiles:
  - from: public/config
    to: config
win:
  executableName: nebula-studio
  signAndEditExecutable: false
nsis:
  artifactName: nebula-studio-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: nebula-studio-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: nebula-studio-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
