name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-5'
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check formatting, lint, and types
        run: vp check

      - name: ESLint complementary rules
        run: vp exec eslint . --cache

      - name: Stylelint
        run: vp exec stylelint "**/*.{css,scss,vue}" --allow-empty-input --ignore-pattern "**/out/**" --ignore-pattern "**/dist/**" --ignore-pattern "**/dev-dist/**"

      - name: Run unit tests
        run: vp run test

      - name: Build web shell
        run: vp run build:web

      - name: Build federation remotes
        run: vp run build:federation-remotes

      - name: Enforce Host/Remote structural boundaries
        run: vp run check:boundaries

      - name: Enforce Tailwind source isolation
        run: vp run check:css-sources

      - name: Enforce package inventory baseline
        run: vp run check:inventory

      - name: Enforce B-track style/storage inventory
        run: vp run check:b-inventory

      - name: Enforce web and remote bundle budgets
        env:
          NEBULA_CHECK_REMOTE_BUNDLES: 'true'
        run: vp run check:bundle

      - name: Verify generated configs and contracts are up to date
        run: vp run check:generated

      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run mock browser E2E
        run: vp run test:e2e:mock

      - name: Upload verified web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  experience:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Install Playwright Chromium
        run: vp exec playwright install chromium

      - name: Run accessibility, visual, and performance baselines
        run: vp run test:e2e:experience

      - name: Upload experience diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: experience-diagnostics
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: ignore

  electron:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build Electron app
        run: vp run --filter @nebula-studio/electron build

      - name: Run Electron capability E2E
        run: vp exec playwright test --project=electron

      - name: Upload Electron E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-diagnostics
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: ignore

  real-stack:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: nebula-studio

      - uses: actions/checkout@v6
        with:
          repository: LiaoHan5426/nebula
          path: nebula

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - name: Install frontend dependencies
        working-directory: nebula-studio
        run: vp install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: nebula-studio
        run: vp exec playwright install chromium

      - name: Run real-stack E2E
        working-directory: nebula-studio
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/e2e/run-real-stack.ps1 -BackendRoot "${{ github.workspace }}\nebula"

      - name: Upload service and Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-stack-diagnostics
          path: |
            nebula-studio/test-results/real-stack
            nebula-studio/test-results/playwright
            nebula-studio/playwright-report
          if-no-files-found: ignore
